name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set release version
        shell: pwsh
        run: |
          $version = "${env:APP_VERSION}".TrimStart('v')
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build portable executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name "QR-Link-Opener-$env:APP_VERSION-portable" --collect-all cv2 --distpath dist --workpath build app.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: iscc /DAPP_VERSION=$env:APP_VERSION installer.iss

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe, installer-output\*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path.Substring((Get-Location).Path.Length + 1) } | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QR-Link-Opener-${{ env.APP_VERSION }}
          path: |
            dist/*.exe
            installer-output/*.exe
            SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            installer-output/*.exe
            SHA256SUMS.txt
